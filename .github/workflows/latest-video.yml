name: Update latest YouTube video

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths: [".github/workflows/latest-video.yml", "scripts/update_latest.py"]

permissions:
  contents: write

concurrency:
  group: latest-video
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_latest.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain latest.json)" ]; then
            git config user.name "latest-video-bot"
            git config user.email "actions@users.noreply.github.com"
            git add latest.json
            git commit -m "Update latest video"
            git push
          fi
